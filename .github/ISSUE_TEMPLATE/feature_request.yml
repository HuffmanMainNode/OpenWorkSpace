name: Feature proposal
description: Propose a capability or improvement
title: "[Proposal]: "
labels: ["enhancement", "needs-design"]
body:
  - type: textarea
    id: need
    attributes:
      label: Problem and intended users
      description: Describe the need without assuming a particular implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security, privacy, and permissions
      description: What data, privileges, network access, or execution would be involved?
  - type: textarea
    id: alternatives
    attributes:
      label: Existing tools and alternatives
  - type: textarea
    id: constraints
    attributes:
      label: Offline, platform, licensing, and compatibility constraints
