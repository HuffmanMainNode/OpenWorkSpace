name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: pytest
      - name: Lint
        run: ruff check .
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Verify wheel includes runtime schemas
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("openworkspace-*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "openworkspace/capability.schema.json",
              "openworkspace/evidence.schema.json",
              "openworkspace/registry.schema.json",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"wheel is missing runtime schemas: {sorted(missing)}")
          print(f"Verified runtime schemas in {wheel.name}")
          PY
