name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: pytest
      - name: Lint
        run: ruff check .
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Verify wheel includes runtime schemas
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("openworkspace-*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "openworkspace/capability.schema.json",
              "openworkspace/evidence.schema.json",
              "openworkspace/registry.schema.json",
              "openworkspace/identity.schema.json",
              "openworkspace/task.schema.json",
              "openworkspace/message.schema.json",
              "openworkspace/resource.schema.json",
              "openworkspace/plugin-manifest.schema.json",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"wheel is missing runtime schemas: {sorted(missing)}")
          print(f"Verified runtime schemas in {wheel.name}")
          PY
      - name: Install wheel into isolated target
        run: python -m pip install --no-deps --target dist/install dist/openworkspace-*.whl
      - name: Smoke-test installed wheel resources
        run: |
          python - <<'PY'
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, "dist/install")
          from openworkspace.evidence import append_event, read_events
          from openworkspace.registry import CapabilityRegistry
          from openworkspace.identity import IdentityRegistry
          from openworkspace.identity_keys import IdentityKeyStore
          from openworkspace.tasks import TaskStore
          from openworkspace.messages import MessageStore
          from openworkspace.resources import ResourceCatalog
          from openworkspace.packages import PackageCatalog

          root = Path(tempfile.mkdtemp())
          journal = root / "events.jsonl"
          append_event(
              journal,
              event_type="wheel.smoke_test",
              actor="ci",
              subject="installed-wheel",
              result="success",
          )
          assert len(read_events(journal)) == 1
          registry = CapabilityRegistry(root / "registry.sqlite3")
          assert registry.list() == []
          identities = IdentityRegistry(root / "runtime.sqlite3")
          assert identities.list() == []
          identities.create({
              "id": "wheel.smoke.identity", "kind": "user", "issuer": "ci",
              "key_reference": None, "status": "active", "valid_from": None,
              "valid_until": None, "attributes": {}
          })
          key_store = IdentityKeyStore(root / "keys")
          key_store.generate(
              "wheel.smoke.identity", "wheel smoke test passphrase", identities
          )
          signature = key_store.sign(
              "wheel.smoke.identity", b"wheel smoke", "wheel smoke test passphrase",
              identities
          )
          assert key_store.verify(
              "wheel.smoke.identity", b"wheel smoke", signature, identities
          )
          tasks = TaskStore(root / "runtime.sqlite3")
          assert tasks.list() == []
          messages = MessageStore(root / "runtime.sqlite3")
          assert messages is not None
          resources = ResourceCatalog(root / "runtime.sqlite3")
          assert resources.list() == []
          packages = PackageCatalog(root / "runtime.sqlite3")
          assert packages.list() == []
          print("Installed wheel loaded bundled schemas and initialized all local stores.")
          PY
