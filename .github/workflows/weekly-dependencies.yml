name: Weekly dependency compatibility

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install newest allowed development dependencies
        run: python -m pip install --upgrade -e '.[dev]'
      - name: Run test suite
        run: pytest
      - name: Run lint
        run: ruff check .
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Smoke-test installed CLI
        run: |
          openworkspace --help
          output="$(openworkspace demo)"
          python -c 'import json,sys; data=json.loads(sys.stdin.read()); assert data["executed"] is False; assert data["os_access_enforced"] is False' <<< "$output"
