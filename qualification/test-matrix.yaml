schema_version: "1.0"
release_target: "0.1-foundation"
environments:
  - name: ubuntu-python-3.11
    automation: github-actions
    status: tested
  - name: ubuntu-python-3.12
    automation: github-actions
    status: tested
  - name: ubuntu-python-3.13
    automation: github-actions
    status: tested
  - name: windows
    automation: none
    status: not-tested
  - name: macos
    automation: none
    status: not-tested
test_groups:
  - id: unit-and-contracts
    command: "pytest"
    status: tested
    coverage: "Manifest, policy, registry, identity, task, message, evidence, resource, package intake, discovery, contribution security invariants, CLI, schemas, fixtures, data catalogs, and Markdown links."
  - id: lint
    command: "ruff check ."
    status: tested
  - id: wheel-build
    command: "python -m pip wheel --no-deps . --wheel-dir dist"
    status: tested
  - id: wheel-resource-inclusion
    command: "Inspect wheel archive for bundled runtime JSON schemas"
    status: tested
  - id: cli-clean-install-smoke
    command: "openworkspace --help; openworkspace init --path TEMP; openworkspace list --database TEMP/registry.sqlite3; openworkspace demo"
    status: tested
  - id: installed-wheel-smoke
    command: "Install built wheel into isolated target and initialize each local store"
    status: tested
  - id: offline-operation
    command: "Run CLI with network disabled"
    status: pending
  - id: dependency-vulnerability-audit
    command: "Automated dependency advisory scan"
    status: pending
  - id: resilience-and-concurrency
    command: "Concurrent registry registration and cross-process evidence writer serialization tested; crash recovery and power-loss qualification remain pending"
    status: partial
  - id: sandbox-enforcement
    command: "Platform-specific adversarial isolation qualification"
    status: blocked
notes:
  - "A passing CI run proves only the commands and matrix listed above."
  - "Windows and macOS compatibility are not currently claimed."
  - "No plugin execution or sandbox isolation is qualified."
  - "Contribution intake is metadata-only; no submitted tool is automatically installed or executed."
