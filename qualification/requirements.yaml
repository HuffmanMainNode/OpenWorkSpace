    title: Concurrent JSONL writers are safe
    status: blocked
    test: no locking guarantee exists
  - id: WSP-015
    title: OS filesystem and network permissions enforced
    status: blocked
    test: requires qualified enforcement boundary
  - id: WSP-016
    title: Independent TypeScript contract consumer
    status: deferred
    test: requires shared fixture suite
  - id: WSP-017
    title: Local registry rejects duplicate capability IDs
    status: tested
    test: tests/test_registry.py::test_duplicate_id_is_rejected_without_overwrite
  - id: WSP-018
    title: Registry detects stored manifest modification
    status: tested
    test: tests/test_registry.py::test_stored_manifest_digest_is_checked
  - id: WSP-019
    title: Registry records permission evaluation
    status: tested
    test: tests/test_registry.py::test_permission_evaluation_defaults_to_deny_and_is_audited
  - id: WSP-020
    title: All published JSON schemas are valid
    status: tested
    test: tests/test_schema_catalog.py::test_all_published_schemas_are_valid_json_schema
